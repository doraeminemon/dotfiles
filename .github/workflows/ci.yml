name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: Dry-run smoke test
        shell: bash
        env:
          DOT_EXA_API_KEY: ci-dummy
        run: |
          # Exit 1 is legitimate: some module Checks fail on a CI runner.
          # Any other non-zero code (a panic exits 2) fails the job.
          set +e
          go run ./cmd/dot install --dry-run --yes
          rc=$?
          set -e
          echo "dot install --dry-run exit code: $rc"
          test "$rc" -le 1
      - name: Dry run left the checkout clean
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "dry run changed the checkout:"
            echo "$status"
            exit 1
          fi

  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license needed on a personal account.
          GITLEAKS_ENABLE_COMMENTS: "false"
